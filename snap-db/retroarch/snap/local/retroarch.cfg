# Skeleton config from the Flathub manifest, copied to the user on first run.

# Assets directory, queried by default when a menu looks for them.
assets_directory = "/usr/share/libretro/assets/"

# Path to content database directory.
content_database_path = "/usr/share/libretro/database/rdb"

# Path to cheat database directory.
cheat_database_path = "/usr/share/libretro/database/cht"

# Saved queries are stored to this directory.
cursor_directory = "/usr/share/libretro/database/cursors"

# A directory for where to search for libretro core information.
libretro_info_path = "/usr/share/libretro/info"

# Directory for joypad autoconfigs.
joypad_autoconfig_dir = "/usr/share/libretro/autoconfig"

# Defines a directory where CPU-based video filters are kept.
video_filter_dir = "/usr/lib/retroarch/filters/video"

# Directory where DSP plugins are kept.
audio_filter_dir = "/usr/lib/retroarch/filters/audio"

# Defines a directory where shaders (Cg, CGP, GLSL) are kept for easy access.
video_shader_dir = "/usr/share/libretro/shaders"

# Defines a directory where overlays are kept.
overlay_directory = "/usr/share/libretro/overlays"

# If disabled, will hide 'Online Updater' inside the menu.
menu_show_core_updater = "true"

# Use WebM for video recording
video_record_quality = "6"

# Disable suspending the screensaver, as xdg-screensaver may not be available.
suspend_screensaver_enable = "false"

# udev joypads need the joystick interface connected; sdl2 works as-is.
input_joypad_driver = "sdl2"
