name: signal-desktop
title: Signal
base: core24
version: '8.26.0'
summary: Private messaging from your desktop
description: |
  Signal is a messaging app with privacy at its core. It is free and easy to
  use, with strong end-to-end encryption that keeps your conversations secure.

  Signal Desktop links to an existing Signal account on your phone; it is not
  a standalone client, so keep the phone reachable while you set it up.

  This snap is a repack of the official `.deb` that Signal Messenger publishes
  at https://updates.signal.org/desktop/apt. It is not published or endorsed
  by Signal Messenger, LLC. Points worth knowing:

    * Signal Desktop only ships a self-updater for macOS and AppImage builds,
      so this snap will not update itself in place from within the app. Run
      `snapkit update signal-desktop` to move to a newer release.

    * The message database is encrypted with a key that Electron's safeStorage
      hands to your login keyring over D-Bus, so connect the interface:

          sudo snap connect signal-desktop:password-manager-service

      Without it Signal falls back to storing that key unencrypted next to the
      database.

    * Voice and video calls need `camera` and `audio-record`; both are manual
      connections on a locally built snap. Attachments you send from outside
      `~/snap/signal-desktop` need `home`, and `removable-media` for /media.

license: AGPL-3.0-only
website: https://signal.org/
source-code: https://github.com/signalapp/Signal-Desktop
contact: https://support.signal.org/
issues: https://github.com/signalapp/Signal-Desktop/issues

grade: stable
confinement: strict

# Signal publishes amd64 only; there is no arm64 .deb to repack.
platforms:
  amd64:

apps:
  signal-desktop:
    command: bin/signal-launch
    extensions:
      # gnome brings GTK and the desktop plugs; gpu brings the GL stack.
      - gnome
      - gpu
    desktop: usr/share/applications/signal-desktop.desktop
    common-id: org.signal.Signal
    environment:
      # libdecor draws a second titlebar over Electron's frameless window.
      DISABLE_WAYLAND_LIBDECOR: '1'
    plugs:
      - network
      # WebRTC binds local UDP ports for calls
      - network-bind
      - browser-support
      - audio-playback
      - audio-record
      - camera
      - home
      - removable-media
      # keeps the screen awake for the duration of a call
      - screen-inhibit-control
      # Electron safeStorage -> libsecret -> org.freedesktop.secrets
      - password-manager-service
      - hardware-observe
      # tray icon and notifications on non-GNOME desktops
      - unity7

parts:
  signal:
    plugin: dump
    source: https://updates.signal.org/desktop/apt/pool/s/signal-desktop/signal-desktop_8.26.0_amd64.deb
    source-checksum: sha256/5265d3e3090a9785393c7547f8d720658d04ee717efb5810e01de2221b032b3d
    override-build: |
      craftctl default

      # The icon is a bare theme name, and a snap installs into no theme.
      sed -i 's|^Icon=.*|Icon=${SNAP}/usr/share/icons/hicolor/512x512/apps/signal-desktop.png|' \
        "${CRAFT_PART_INSTALL}/usr/share/applications/signal-desktop.desktop"

      # dpkg-time leftovers: snapd supplies this snap's AppArmor profile.
      rm -rf "${CRAFT_PART_INSTALL}/usr/share/doc" \
        "${CRAFT_PART_INSTALL}/opt/Signal/resources/apparmor-profile"
    stage-packages:
      # Depends: of the .deb
      - libnotify4
      - libxtst6
      - libnss3
      - libasound2t64
      - libpulse0
      - libxss1
      - libgtk-3-0t64
      - libgbm1
      - libx11-xcb1
      # DT_NEEDED of /opt/Signal/signal-desktop beyond the Depends: list
      - libnspr4
      - libatk1.0-0t64
      - libatk-bridge2.0-0t64
      - libatspi2.0-0t64
      - libcups2t64
      - libdbus-1-3
      - libcairo2
      - libpango-1.0-0
      - libexpat1
      - libxkbcommon0
      - libudev1
      - libglib2.0-0t64
      - libx11-6
      - libxcb1
      - libxcomposite1
      - libxdamage1
      - libxext6
      - libxfixes3
      - libxrandr2
      # dlopen'd at runtime, so nothing above can pull them in automatically
      - libsecret-1-0        # safeStorage, for the database key
      - libdbusmenu-glib4    # the tray icon's menu
      - libxcursor1
      - libpci3              # GPU probing
      - libva2               # hardware video decode during calls
      - libva-drm2
      - libva-x11-2
      - libpipewire-0.3-0    # screen sharing through the Wayland portal
      - ca-certificates

  launcher:
    plugin: dump
    source: snap/local
    organize:
      signal-launch: bin/signal-launch

  cleanup:
    after:
      - signal
      - launcher
    plugin: nil
    build-snaps:
      - core24
      - gnome-46-2404
    override-prime: |
      # Drop what the platform provides, so GTK is loaded once from it.
      set -eu
      for snapdir in /snap/core24/current /snap/gnome-46-2404/current; do
        [ -d "$snapdir" ] || continue
        cd "$snapdir"
        find . -type f,l -exec rm -f "${CRAFT_PRIME}/{}" \;
      done

      # Match on soname: point releases differ by filename, leaving 25 MB.
      cd "${CRAFT_PRIME}"
      while read -r lib; do
        soname="$(basename "$lib" | sed -E 's|(\.so\.[0-9]+).*|\1|')"
        for snapdir in /snap/core24/current /snap/gnome-46-2404/current; do
          if [ -e "$snapdir/$(dirname "$lib")/$soname" ]; then
            rm -f "$lib"
            break
          fi
        done
      done < <(find usr/lib lib -name '*.so.*' -type f 2>/dev/null)
