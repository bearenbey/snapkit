name: librewolf
title: LibreWolf
base: core24
version: '156.0-1'
summary: A fork of Firefox, focused on privacy, security and freedom
description: |
  LibreWolf is an independent, community-run fork of Firefox with privacy,
  security and user freedom as its goals: telemetry, studies and the
  crash reporter are gone, uBlock Origin is included, HTTPS-only mode and
  fingerprinting resistance are on, and its settings are locked in
  librewolf.cfg and policies.json rather than left to an update to change.

  This snap is a repack of the official upstream Linux tarball
  (librewolf-156.0-1-linux-x86_64-package.tar.xz), the same file the Flathub
  package is built from, and is not published or endorsed by the LibreWolf
  Community. LibreWolf is not associated with Mozilla; Firefox is a
  trademark of the Mozilla Foundation.

license: MPL-2.0
source-code: https://codeberg.org/librewolf/source
issues: https://codeberg.org/librewolf/issues/issues
website: https://librewolf.net
contact: https://codeberg.org/librewolf/issues/issues

# 128px is the largest in the tarball; there is no hicolor tree to pick from.
icon: usr/lib/librewolf/browser/chrome/icons/default/default128.png

grade: stable
confinement: strict

platforms:
  amd64:
    build-on: [amd64]
    build-for: [amd64]

apps:
  librewolf:
    command: bin/launcher
    # Flathub's id for the same tarball, so a software centre can match them.
    common-id: io.gitlab.librewolf-community
    desktop: share/applications/librewolf.desktop
    # The extension brings the command chain, desktop plugs and hooks.
    extensions: [gnome]
    plugs:
      - unity7
      - browser-sandbox
      - network
      - network-bind
      - home
      - removable-media
      - audio-playback
      - audio-record
      - camera
      - cups-control
      - hardware-observe
      - joystick
      - mount-observe
      - screen-inhibit-control
      - password-manager-service
      - system-packages-doc
      - u2f-devices
      - upower-observe
    slots:
      - dbus-librewolf
    environment:
      TMPDIR: $XDG_RUNTIME_DIR

plugs:
  browser-sandbox:
    interface: browser-support
    # Gecko's sandbox needs user namespaces, and this does not auto-connect.
    allow-sandbox: true

slots:
  dbus-librewolf:
    interface: dbus
    bus: session
    # application.ini says RemotingName=librewolf; Gecko's remoting owns
    # org.mozilla.librewolf plus a per-profile suffix.
    name: org.mozilla.librewolf

layout:
  # Gecko's spell checker reads its dictionaries from this path and no other.
  /usr/share/hunspell:
    bind: $SNAP/gnome-platform/usr/share/hunspell

parts:
  librewolf:
    plugin: dump
    source: librewolf-156.0-1-linux-x86_64-package.tar.xz
    source-type: tar
    # craft-parts strips the librewolf/ dir, so put the payload back under usr/lib.
    organize:
      '*': usr/lib/librewolf/
    # LibreWolf strips the updater itself and ships a distribution/policies.json
    # that sets DisableAppUpdate, so unlike its Gecko siblings this snap carries
    # no policy overlay of its own: an overlay would replace upstream's whole
    # policy set. What is left of the update machinery is dropped here.
    prime:
      - -usr/lib/librewolf/precomplete
      - -usr/lib/librewolf/removed-files

  overlay:
    plugin: dump
    source: overlay
    organize:
      meta/gui/librewolf.desktop: share/applications/librewolf.desktop
    stage:
      - bin/launcher
      - share/applications/librewolf.desktop
